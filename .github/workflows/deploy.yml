name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 官网提根（2026-10-30）：发布源只有 HighBlock 新站，站点位于 Pages 根。
      # 原 React 原型不再随此站点发布；旧 /flagship/ 深链由 404.html 跳回根对应路径。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/highblock-site/.nvmrc

      # dist/assets 与 dist/legal 是手工源码，禁止先清空再构建
      - name: Build and check HighBlock site
        working-directory: web/highblock-site
        run: |
          npm run build
          npm run check

      - name: Publish site at root
        run: |
          mkdir -p dist
          cp -R web/highblock-site/dist/. dist/
          cp web/highblock-site/deployment/pages-404-redirect.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        uses: actions/deploy-pages@v4
