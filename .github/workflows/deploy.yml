name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 双源发布（2026-10-30）：官网（HighBlock 新站）占 Pages 根，
      # React 原型恢复上线挂 /app/ 子路径（vite base './' 相对路径天然兼容）。
      # 旧 /flagship/ 深链由 404.html 跳回根对应路径。
      - name: Setup Node (site)
        uses: actions/setup-node@v4
        with:
          node-version-file: web/highblock-site/.nvmrc

      # dist/assets 与 dist/legal 是手工源码，禁止先清空再构建
      - name: Build and check HighBlock site
        working-directory: web/highblock-site
        run: |
          npm run build
          npm run check

      - name: Setup Node (prototype)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build prototype
        run: |
          npm ci
          npx vite build --outDir dist-prototype

      - name: Publish site at root and prototype at /app/
        run: |
          mkdir -p dist/app
          cp -R web/highblock-site/dist/. dist/
          cp -R dist-prototype/. dist/app/
          rm -rf dist-prototype
          cp web/highblock-site/deployment/pages-404-redirect.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        uses: actions/deploy-pages@v4
