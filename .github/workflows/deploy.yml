name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 官网发布源（2026-10-29）：HighBlock 新站（web/highblock-site/dist，含手工源码 assets/legal）。
      # 发布路径名保留 flagship 仅为旧 URL（.../flagship/）兼容，内容已是新站；旧站 web/flagship/ 不再发布。
      - name: Setup Node for HighBlock site
        uses: actions/setup-node@v4
        with:
          node-version-file: web/highblock-site/.nvmrc

      - name: Build and check HighBlock site
        working-directory: web/highblock-site
        run: |
          npm run build
          npm run check

      - name: Publish site
        run: |
          mkdir -p dist/flagship
          cp -R web/highblock-site/dist/. dist/flagship/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        uses: actions/deploy-pages@v4
