<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B2B26"/>
      <stop offset="50%" style="stop-color:#163832"/>
      <stop offset="100%" style="stop-color:#11998E"/>
    </linearGradient>
    <linearGradient id="glow" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#38EF7D;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#11998E;stop-opacity:0"/>
    </linearGradient>
    <filter id="neon"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#glow)"/>
  <!-- Hexagonal grid background -->
  <g opacity="0.06" stroke="#38EF7D" stroke-width="0.5" fill="none">
    <polygon points="60,20 90,35 90,65 60,80 30,65 30,35"/>
    <polygon points="120,20 150,35 150,65 120,80 90,65 90,35"/>
    <polygon points="180,20 210,35 210,65 180,80 150,65 150,35"/>
    <polygon points="90,80 120,95 120,125 90,140 60,125 60,95"/>
    <polygon points="150,80 180,95 180,125 150,140 120,125 120,95"/>
    <polygon points="210,80 240,95 240,125 210,140 180,125 180,95"/>
    <polygon points="120,140 150,155 150,185 120,200 90,185 90,155"/>
    <polygon points="180,140 210,155 210,185 180,200 150,185 150,155"/>
    <polygon points="150,200 180,215 180,245 150,260 120,245 120,215"/>
  </g>
  <!-- DNA Helix -->
  <g transform="translate(420,150)" opacity="0.25">
    <path d="M-40,-90 C-20,-60 -20,-30 -40,0 C-60,30 -60,60 -40,90" fill="none" stroke="#38EF7D" stroke-width="2.5"/>
    <path d="M40,-90 C20,-60 20,-30 40,0 C60,30 60,60 40,90" fill="none" stroke="#38EF7D" stroke-width="2.5"/>
    <!-- Cross bonds -->
    <line x1="-36" y1="-75" x2="36" y2="-75" stroke="rgba(56,239,125,0.3)" stroke-width="1"/>
    <line x1="-30" y1="-45" x2="30" y2="-45" stroke="rgba(56,239,125,0.3)" stroke-width="1"/>
    <line x1="-36" y1="-15" x2="36" y2="-15" stroke="rgba(56,239,125,0.3)" stroke-width="1"/>
    <line x1="-36" y1="15" x2="36" y2="15" stroke="rgba(56,239,125,0.3)" stroke-width="1"/>
    <line x1="-30" y1="45" x2="30" y2="45" stroke="rgba(56,239,125,0.3)" stroke-width="1"/>
    <line x1="-36" y1="75" x2="36" y2="75" stroke="rgba(56,239,125,0.3)" stroke-width="1"/>
  </g>
  <!-- Molecular dots -->
  <g opacity="0.12" fill="#38EF7D">
    <circle cx="100" cy="100" r="3"/><circle cx="115" cy="90" r="2"/><circle cx="85" cy="110" r="2"/>
    <circle cx="200" cy="120" r="3"/><circle cx="215" cy="110" r="2"/><circle cx="185" cy="130" r="2"/>
    <circle cx="150" cy="170" r="3"/><circle cx="165" cy="160" r="2"/><circle cx="135" cy="180" r="2"/>
  </g>
  <!-- Floating particles -->
  <g opacity="0.08" fill="#38EF7D">
    <circle cx="50" cy="50" r="1.5"/><circle cx="300" cy="30" r="1"/>
    <circle cx="350" cy="80" r="1.5"/><circle cx="40" cy="200" r="1"/>
    <circle cx="320" cy="250" r="1.5"/><circle cx="550" cy="40" r="1"/>
  </g>
  <circle cx="570" cy="30" r="2" fill="rgba(56,239,125,0.3)"/>
  <circle cx="555" cy="50" r="1.5" fill="rgba(56,239,125,0.2)"/>
</svg>