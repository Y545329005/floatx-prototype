<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A2E"/>
      <stop offset="50%" style="stop-color:#2D1B4E"/>
      <stop offset="100%" style="stop-color:#16213E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#fa709a;stop-opacity:0.25"/>
    </linearGradient>
    <filter id="neon"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#glow)"/>
  <!-- Grid -->
  <g opacity="0.04" stroke="#fee140" stroke-width="0.5">
    <line x1="0" y1="50" x2="600" y2="50"/><line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="80" y1="0" x2="80" y2="300"/><line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="480" y1="0" x2="480" y2="300"/><line x1="560" y1="0" x2="560" y2="300"/>
  </g>
  <!-- Candlestick chart -->
  <g transform="translate(100,120)" opacity="0.2">
    <rect x="10" y="0" width="8" height="80" rx="1" fill="none" stroke="#38EF7D" stroke-width="1.5"/>
    <line x1="14" y1="0" x2="14" y2="-10" stroke="#38EF7D" stroke-width="1"/>
    <line x1="14" y1="80" x2="14" y2="90" stroke="#38EF7D" stroke-width="1"/>
    <rect x="35" y="20" width="8" height="60" rx="1" fill="none" stroke="#D32F2F" stroke-width="1.5"/>
    <line x1="39" y1="20" x2="39" y2="10" stroke="#D32F2F" stroke-width="1"/>
    <line x1="39" y1="80" x2="39" y2="90" stroke="#D32F2F" stroke-width="1"/>
    <rect x="60" y="10" width="8" height="70" rx="1" fill="none" stroke="#38EF7D" stroke-width="1.5"/>
    <line x1="64" y1="10" x2="64" y2="0" stroke="#38EF7D" stroke-width="1"/>
    <line x1="64" y1="80" x2="64" y2="90" stroke="#38EF7D" stroke-width="1"/>
    <rect x="85" y="30" width="8" height="50" rx="1" fill="none" stroke="#D32F2F" stroke-width="1.5"/>
    <line x1="89" y1="30" x2="89" y2="20" stroke="#D32F2F" stroke-width="1"/>
    <line x1="89" y1="80" x2="89" y2="90" stroke="#D32F2F" stroke-width="1"/>
    <rect x="110" y="5" width="8" height="75" rx="1" fill="none" stroke="#38EF7D" stroke-width="1.5"/>
    <line x1="114" y1="5" x2="114" y2="-5" stroke="#38EF7D" stroke-width="1"/>
    <line x1="114" y1="80" x2="114" y2="90" stroke="#38EF7D" stroke-width="1"/>
  </g>
  <!-- Line chart -->
  <g transform="translate(360,130)" opacity="0.2">
    <polyline points="0,70 15,55 30,60 45,40 60,35 75,20 90,25 105,10 120,15"
      fill="none" stroke="#fee140" stroke-width="2"/>
    <!-- Fill under line -->
    <polygon points="0,70 0,70 15,55 30,60 45,40 60,35 75,20 90,25 105,10 120,15 120,70"
      fill="url(#chart)" opacity="0.5"/>
  </g>
  <!-- Digital/blockchain nodes -->
  <g opacity="0.08" fill="none" stroke="#fa709a" stroke-width="1">
    <circle cx="50" cy="50" r="3"/><circle cx="130" cy="30" r="3"/><circle cx="210" cy="50" r="3"/>
    <line x1="50" y1="50" x2="130" y2="30" stroke-width="0.5"/>
    <line x1="130" y1="30" x2="210" y2="50" stroke-width="0.5"/>
    <line x1="50" y1="50" x2="210" y2="50" stroke-width="0.5"/>
  </g>
  <!-- Top right blocks (blockchain) -->
  <g transform="translate(520,30)" opacity="0.1" fill="none" stroke="#fee140" stroke-width="1">
    <rect x="0" y="0" width="15" height="15" rx="2"/>
    <rect x="0" y="17" width="15" height="15" rx="2"/>
    <rect x="0" y="34" width="15" height="15" rx="2"/>
  </g>
  <circle cx="570" cy="270" r="2" fill="rgba(250,112,154,0.3)"/>
  <circle cx="555" cy="255" r="1.5" fill="rgba(250,112,154,0.2)"/>
</svg>