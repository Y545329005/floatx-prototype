<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>集团 BPM 工作台（模拟）· HighBlock 原型演示</title>
<style>
  :root { --line:#e5e7eb; --muted:#6b7280; --primary:#2563eb; --danger:#dc2626; --ok:#16a34a; --warn:#d97706; }
  * { box-sizing: border-box; }
  body { font: 14px/1.6 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; color:#111827; background:#f3f4f6; margin:0; }
  header { background:#111827; color:#fff; padding:12px 24px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .demo-tag { font-size:12px; background:rgba(255,255,255,.14); padding:2px 8px; border-radius:10px; }
  header .who { margin-left:auto; font-size:13px; color:#d1d5db; }
  .wrap { max-width: 960px; margin: 20px auto; padding: 0 16px; }
  .login-card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:32px; max-width:420px; margin:10vh auto 0; text-align:center; }
  .login-card h2 { margin:0 0 6px; font-size:18px; }
  .login-card p { color:var(--muted); font-size:13px; margin:0 0 20px; }
  .user-btn { display:block; width:100%; text-align:left; margin-bottom:10px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:14px; }
  .user-btn strong { display:block; }
  .user-btn span { color:var(--muted); font-size:12px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn { padding:8px 16px; border:1px solid var(--line); border-radius:20px; background:#fff; font-size:13px; }
  .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .ticket { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .ticket-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .ticket-head strong { font-size:14px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:10px; background:#eef2ff; color:var(--primary); }
  .badge.gray { background:#f3f4f6; color:var(--muted); }
  .badge.red { background:#fef2f2; color:var(--danger); }
  .badge.green { background:#f0fdf4; color:var(--ok); }
  .badge.amber { background:#fffbeb; color:var(--warn); }
  .ticket-meta { color:var(--muted); font-size:12px; margin-top:4px; }
  .ticket-actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn { padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:13px; }
  .btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  .btn.danger { background:#fff; color:var(--danger); border-color:#fecaca; }
  .btn:disabled { opacity:.45; }
  .detail-mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; }
  .detail { background:#fff; border-radius:14px; max-width:680px; width:100%; padding:24px; }
  .detail h3 { margin:0 0 4px; font-size:16px; }
  .detail .sub { color:var(--muted); font-size:12px; margin-bottom:16px; }
  .kv { display:grid; grid-template-columns:96px 1fr; gap:6px 12px; font-size:13px; margin-bottom:16px; }
  .kv .k { color:var(--muted); }
  .op-block { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .op-block h4 { margin:0 0 8px; font-size:13px; }
  .op-block textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; min-height:56px; }
  .op-row { display:flex; gap:8px; margin-top:8px; }
  .tasks-line { font-size:12px; color:var(--muted); margin:8px 0 0; }
  .close-x { float:right; border:none; background:none; font-size:18px; cursor:pointer; color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:60px 0; }
  .hint { font-size:12px; color:var(--muted); margin-top:16px; }
</style>
</head>
<body>
<header>
  <h1>集团 BPM 工作台</h1>
  <span class="demo-tag">原型模拟 · 非真实系统</span>
  <span class="who" id="who"></span>
</header>
<div class="wrap" id="app"></div>

<script>
/* =============================================================
 * 模拟 BPM（零构建静态页）——与主应用共享同源存储，schema 即「API 契约」：
 *   zhifu-bpm-state  { tickets:[...] }            工单表（applicantUsername/instanceState/tasks）
 *   zhifu-bpm-events [ {eventId,eventType,...} ]  webhook 事件队列（主应用事件泵消费，eventId 幂等）
 *   IndexedDB zhifu-bpm-files / files             附件（内容快照 HTML，主应用提交时写入）
 * 真实接入时本页由集团 BPM 系统替代，webhook 走 HTTPS 白名单推送；此处写队列 = 模拟推送。
 * 「重发 webhook」= 同 eventId 重推，用于演示主应用幂等（重试不产生重复状态迁移）。
 * ============================================================= */
const LS_STATE = 'zhifu-bpm-state';
const LS_EVENTS = 'zhifu-bpm-events';
const USERS = {
  'bpm-legal': { name: '李法务', node: 'legal', taskKey: 'legal_review' },
  'bpm-ro':    { name: '陈主任', node: 'ro',    taskKey: 'ro_review' },
};
const STATE_DESC = { [-3]:'作废', [-2]:'已暂停', [-1]:'暂存', 0:'审批中', 1:'已完成', 2:'已拒绝', 3:'已撤回', 4:'自动通过', 5:'自动拒绝', 8:'超期自动终止' };

function readJson(k, fb) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch (e) { return fb; } }
function writeJson(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function readTickets() { const st = readJson(LS_STATE, { tickets: [] }); return Array.isArray(st.tickets) ? st.tickets : []; }
function writeTickets(t) { writeJson(LS_STATE, { tickets: t }); }
function nowStr() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }

function pushEvent(eventType, ticket, taskInfo) {
  const queue = readJson(LS_EVENTS, []);
  const ev = {
    eventId: `evt-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    eventType, eventTime: nowStr(), webhookVersion: '1.0',
    payload: { processInfo: {
      instanceId: ticket.instanceId, processKey: ticket.processKey, processName: '内容发布审批',
      instanceState: ticket.instanceState, instanceStateDesc: STATE_DESC[ticket.instanceState] || '未知',
      applicantUsername: ticket.applicantUsername,
      formData: { businessId: ticket.businessId, contentTitle: ticket.formData.contentTitle },
    }, taskInfo: taskInfo || undefined },
  };
  queue.push(ev);
  writeJson(LS_EVENTS, queue);
  // 记录最近事件供「重发 webhook」演示（同 eventId 重推同一事件本体）
  ticket.lastEventId = ev.eventId;
  ticket._lastEvent = ev;
  return ev;
}

let me = null;          // 当前身份
let tab = 'todo';       // todo | all
let openId = null;      // 展开详情的工单

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

function stateBadge(st) {
  if (st === 0) return '<span class="badge">审批中</span>';
  if (st === 1) return '<span class="badge green">已完成</span>';
  if (st === 2) return '<span class="badge red">已拒绝</span>';
  if (st === 3) return '<span class="badge gray">已撤回</span>';
  if (st === 4) return '<span class="badge amber">自动通过</span>';
  if (st === 8) return '<span class="badge amber">超期终止</span>';
  return `<span class="badge gray">${STATE_DESC[st] || '未知'}</span>`;
}

function renderLogin() {
  document.getElementById('who').textContent = '';
  document.getElementById('app').innerHTML = `
    <div class="login-card">
      <h2>选择审批身份</h2>
      <p>模拟 BPM 审批人（与主应用种子工单对应）</p>
      ${Object.entries(USERS).map(([u, info]) => `
        <button class="user-btn" data-user="${u}">
          <strong>${esc(info.name)}</strong>
          <span>${u} · ${info.node === 'legal' ? '法务审阅节点' : 'RO 合规审阅节点'}</span>
        </button>`).join('')}
      <div class="hint">审批操作将写入模拟工单表并触发 webhook 事件，主应用（另一个标签页）实时回调刷新。</div>
    </div>`;
  document.querySelectorAll('.user-btn').forEach(b => {
    b.addEventListener('click', () => { me = b.dataset.user; render(); });
  });
}

function myTodoCount() {
  const u = USERS[me];
  return readTickets().filter(t => t.instanceState === 0 && t.tasks.some(k => k.taskKey === u.taskKey && k.status === 'PENDING')).length;
}

function render() {
  if (!me) { renderLogin(); return; }
  const u = USERS[me];
  document.getElementById('who').textContent = `${u.name}（${me}）`;
  const tickets = readTickets();
  const list = tickets.filter(t => tab === 'all' ? true : (t.instanceState === 0 && t.tasks.some(k => k.taskKey === u.taskKey && k.status === 'PENDING')));
  const detail = openId ? tickets.find(t => t.instanceId === openId) : null;

  document.getElementById('app').innerHTML = `
    <div class="tabs">
      <button class="tab-btn ${tab === 'todo' ? 'active' : ''}" data-tab="todo">我的待办（${myTodoCount()}）</button>
      <button class="tab-btn ${tab === 'all' ? 'active' : ''}" data-tab="all">全部工单（${tickets.length}）</button>
      <button class="tab-btn" data-tab="logout">退出身份</button>
    </div>
    ${list.length === 0 ? '<div class="empty">暂无工单</div>' : ''}
    ${list.map(t => {
      const mine = t.tasks.find(k => k.taskKey === u.taskKey);
      const canOp = t.instanceState === 0 && mine && mine.status === 'PENDING';
      return `
      <div class="ticket">
        <div class="ticket-head">
          <strong>${esc(t.formData.contentTitle || '(未命名)')}</strong>
          ${stateBadge(t.instanceState)}
        </div>
        <div class="ticket-meta">
          ${esc(t.businessId)} · 申请：${esc(t.applicantUsername)} · 建单：${esc(t.createTime)}
          <span class="tasks-line">节点：${t.tasks.map(k => `${esc(k.taskName)} ${k.status === 'COMPLETED' ? '✓' : k.status === 'REJECTED' ? '✗驳回' : k.status === 'CLOSED' ? '—关闭' : '待审'}`).join(' · ')}</span>
        </div>
        <div class="ticket-actions">
          <button class="btn" data-open="${t.instanceId}">查看工单</button>
          ${canOp ? `<button class="btn" data-approve="${t.instanceId}">通过</button>
          <button class="btn danger" data-reject="${t.instanceId}">驳回</button>` : ''}
          ${t.instanceState === 0 ? `
            <button class="btn" data-revoke="${t.instanceId}" title="模拟申请人撤单（instanceState=3）">模拟撤单</button>
            <button class="btn" data-autoterm="${t.instanceId}" title="模拟超期自动终止（instanceState=8）">模拟超期终止</button>
            <button class="btn" data-autoappr="${t.instanceId}" title="模拟超时自动通过（instanceState=4，主应用将直接发布并标注未经人工审阅）">模拟自动通过</button>` : ''}
          ${t.lastEventId ? `<button class="btn" data-resend="${t.instanceId}" title="以相同 eventId 重推最后一个 webhook 事件（演示主应用幂等）">重发 webhook</button>` : ''}
        </div>
      </div>`;
    }).join('')}
    ${detail ? renderDetail(detail) : ''}
    <div class="hint">演示说明：通过/驳回 = 真实会签动作；「模拟撤单 / 超期终止 / 自动通过」用于覆盖 instanceState 3 / 8 / 4 分支（4 = 自动通过：主应用审批通过即自动发布，时间线标注「未经人工审阅」）。</div>
  `;

  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.tab === 'logout') { me = null; openId = null; renderLogin(); return; }
    tab = b.dataset.tab; render();
  }));
  document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { openId = b.dataset.open; render(); }));
  document.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', () => {
    const remark = window.prompt('审批意见（选填，主应用进度中心可见）：', '同意');
    if (remark === null) return;
    act(b.dataset.approve, 'approve', remark);
  }));
  document.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', () => {
    const remark = window.prompt('驳回意见（必填，将展示在主应用进度中心）：', '');
    if (remark === null) return;
    if (!String(remark).trim()) { window.alert('驳回必须填写意见'); return; }
    act(b.dataset.reject, 'reject', remark);
  }));
  document.querySelectorAll('[data-revoke]').forEach(b => b.addEventListener('click', () => { if (window.confirm('模拟申请人撤单？工单转「已撤回」（instanceState=3），主应用回草稿。')) act(b.dataset.revoke, 'revoke'); }));
  document.querySelectorAll('[data-autoterm]').forEach(b => b.addEventListener('click', () => { if (window.confirm('模拟超期自动终止？工单转「超期终止」（instanceState=8），主应用回草稿并告警。')) act(b.dataset.autoterm, 'autoterm'); }));
  document.querySelectorAll('[data-autoappr]').forEach(b => b.addEventListener('click', () => { if (window.confirm('模拟超时自动通过？工单转「自动通过」（instanceState=4）——主应用将直接发布该版本，并在时间线标注「未经人工审阅」（合规演示点）。')) act(b.dataset.autoappr, 'autoappr'); }));
  document.querySelectorAll('[data-resend]').forEach(b => b.addEventListener('click', () => {
    const t = readTickets().find(x => x.instanceId === b.dataset.resend);
    if (!t || !t._lastEvent) { window.alert('该工单暂无可重发的事件'); return; }
    const queue = readJson(LS_EVENTS, []);
    const ev = t._lastEvent; // 同 eventId 重推同一事件本体（演示主应用幂等）
    queue.push(ev);
    writeJson(LS_EVENTS, queue);
    window.alert(`已重推事件 ${ev.eventId}（同 eventId）。切到主应用「发布审批」验证：状态不应重复迁移、轨迹不应重复入档（eventId 幂等）。`);
  }));
  bindDetail(detail);
}

function renderDetail(t) {
  const u = USERS[me];
  const mine = t.tasks.find(k => k.taskKey === u.taskKey);
  const canOp = t.instanceState === 0 && mine && mine.status === 'PENDING';
  const previewUrl = t.formData.previewUrl;
  return `
  <div class="detail-mask" data-close="1">
    <div class="detail" data-stop="1">
      <button class="close-x" data-close="1">✕</button>
      <h3>${esc(t.formData.contentTitle || '(未命名)')}</h3>
      <div class="sub">${esc(t.businessId)} · ${stateBadge(t.instanceState)}</div>
      <div class="kv">
        <span class="k">内容类型</span><span>${esc(t.formData.contentTypeLabel || '—')}</span>
        <span class="k">变更说明</span><span>${esc(t.formData.changeSummary || '—')}</span>
        <span class="k">申请账号</span><span>${esc(t.applicantUsername)}</span>
        <span class="k">建单时间</span><span>${esc(t.createTime)}</span>
        <span class="k">合规依据</span><span>${esc(t.formData.complianceNotes || '—')}</span>
        <span class="k">预览链接</span><span>${previewUrl ? `<a href="${esc(previewUrl)}" target="_blank" rel="noreferrer">打开只读预览（与前台同源渲染）</a>` : '—'}</span>
        <span class="k">附件</span><span id="att-slot">${(t.attachments || []).map(a => esc(a.name)).join('、') || '—'}</span>
      </div>
      ${(t.attachments || []).length ? '<button class="btn" id="att-open">查看内容快照（HTML 兜底）</button>' : ''}
      <div class="op-block">
        <h4>会签节点</h4>
        ${t.tasks.map(k => `<div class="tasks-line" style="margin:2px 0"><strong>${esc(k.taskName)}</strong>（${esc(k.assigneeName)}）· ${k.status === 'COMPLETED' ? '已通过' : k.status === 'REJECTED' ? '已驳回' : k.status === 'CLOSED' ? `已关闭（${esc(k.closedNote || '')}）` : '待审'}${k.opinion ? ` · 意见：${esc(k.opinion)}` : ''}${k.operateTime ? ` · ${esc(k.operateTime)}` : ''}</div>`).join('')}
      </div>
      ${canOp ? `
      <div class="op-block">
        <h4>${esc(mine.taskName)} — 我的待办</h4>
        <textarea id="op-remark" placeholder="审批意见（通过选填 / 驳回必填，主应用进度中心可见）"></textarea>
        <div class="op-row">
          <button class="btn primary" id="op-approve">通过</button>
          <button class="btn danger" id="op-reject">驳回</button>
        </div>
      </div>` : ''}
    </div>
  </div>`;
}

function bindDetail(t) {
  if (!t) return;
  document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', (e) => { if (e.target.dataset.close !== undefined) { openId = null; render(); } }));
  const attBtn = document.getElementById('att-open');
  if (attBtn) attBtn.addEventListener('click', async () => {
    const att = (t.attachments || [])[0];
    if (!att || !att.fileId) return;
    const rec = await getBpmFile(att.fileId);
    if (!rec) { window.alert('快照不存在（IndexedDB 被清理？）'); return; }
    const blob = new Blob([rec.html], { type: 'text/html' });
    window.open(URL.createObjectURL(blob), '_blank');
  });
  const ap = document.getElementById('op-approve');
  if (ap) ap.addEventListener('click', () => {
    const remark = document.getElementById('op-remark').value.trim() || '同意';
    act(t.instanceId, 'approve', remark);
  });
  const rj = document.getElementById('op-reject');
  if (rj) rj.addEventListener('click', () => {
    const remark = document.getElementById('op-remark').value.trim();
    if (!remark) { window.alert('驳回必须填写意见'); return; }
    act(t.instanceId, 'reject', remark);
  });
}

function getBpmFile(key) {
  return new Promise((resolve) => {
    const req = indexedDB.open('zhifu-bpm-files', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('files', { keyPath: 'key' }); };
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction('files', 'readonly');
      const g = tx.objectStore('files').get(key);
      g.onsuccess = () => resolve(g.result || null);
      g.onerror = () => resolve(null);
    };
    req.onerror = () => resolve(null);
  });
}

/* 工单动作（与主应用数据层同 schema；操作后写 webhook 事件队列） */
function act(instanceId, action, remark) {
  const tickets = readTickets();
  const t = tickets.find(x => x.instanceId === instanceId);
  if (!t) return;
  const u = USERS[me];
  const now = nowStr();

  if (action === 'approve' || action === 'reject') {
    const task = t.tasks.find(k => k.taskKey === u.taskKey);
    if (!task || task.status !== 'PENDING' || t.instanceState !== 0) { window.alert('任务不在待审状态'); return; }
    task.status = action === 'approve' ? 'COMPLETED' : 'REJECTED';
    task.opinion = remark || '同意';
    task.operateTime = now;
    let evType;
    if (action === 'reject') {
      // 一驳即驳：另一方待审任务自动关闭
      t.tasks.forEach(k => { if (k.status === 'PENDING') { k.status = 'CLOSED'; k.closedNote = '因驳回关闭'; } });
      t.instanceState = 2; t.endTime = now;
      pushEvent('TASK_REJECTED', t, { taskId: task.taskKey, taskName: task.taskName, taskKey: task.taskKey, state: 'REJECTED', operatorUsername: me, operatorName: u.name, opinion: task.opinion, triggerSource: 'USER' });
      pushEvent('PROCESS_COMPLETED', t);
      evType = null;
    } else {
      const allDone = t.tasks.every(k => k.status === 'COMPLETED');
      if (allDone) { t.instanceState = 1; t.endTime = now; evType = 'PROCESS_COMPLETED'; } else { evType = 'TASK_APPROVED'; }
      pushEvent(evType, t, { taskId: task.taskKey, taskName: task.taskName, taskKey: task.taskKey, state: 'COMPLETED', operatorUsername: me, operatorName: u.name, opinion: task.opinion, triggerSource: 'USER' });
    }
  } else if (t.instanceState === 0) {
    if (action === 'revoke') { t.instanceState = 3; t.tasks.forEach(k => { if (k.status === 'PENDING') { k.status = 'CLOSED'; k.closedNote = '因撤回关闭'; } }); t.endTime = now; pushEvent('PROCESS_REVOKED', t); }
    if (action === 'autoterm') { t.instanceState = 8; t.tasks.forEach(k => { if (k.status === 'PENDING') { k.status = 'CLOSED'; k.closedNote = '因超期自动终止关闭'; } }); t.endTime = now; pushEvent('PROCESS_AUTO_TERMINATED', t); }
    if (action === 'autoappr') { t.instanceState = 4; t.tasks.forEach(k => { if (k.status === 'PENDING') { k.status = 'CLOSED'; k.closedNote = '因自动通过关闭'; } }); t.endTime = now; pushEvent('PROCESS_TIMEOUT', t); }
  }
  writeTickets(tickets);
  openId = null;
  render();
}

/* 跨页签同步：主应用操作（如后台撤销提交撤单）后本页刷新 */
window.addEventListener('storage', (e) => { if (e.key === LS_STATE) render(); });
render();
</script>
</body>
</html>
