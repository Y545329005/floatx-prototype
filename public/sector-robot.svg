<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A1E"/>
      <stop offset="50%" style="stop-color:#2D1B36"/>
      <stop offset="100%" style="stop-color:#4A1942"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5576c;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="neon"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#glow)"/>
  <!-- Grid lines -->
  <g opacity="0.04" stroke="#f5576c" stroke-width="0.5">
    <line x1="0" y1="40" x2="600" y2="40"/><line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/><line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/><line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="60" y1="0" x2="60" y2="300"/><line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="180" y1="0" x2="180" y2="300"/><line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/><line x1="420" y1="0" x2="420" y2="300"/>
    <line x1="480" y1="0" x2="480" y2="300"/><line x1="540" y1="0" x2="540" y2="300"/>
  </g>
  <!-- Robot arm -->
  <g transform="translate(420,160)" opacity="0.2">
    <!-- Base -->
    <rect x="-30" y="20" width="60" height="30" rx="5" fill="none" stroke="#f093fb" stroke-width="2"/>
    <rect x="-15" y="-10" width="30" height="30" rx="3" fill="none" stroke="#f093fb" stroke-width="2"/>
    <!-- Arm segments -->
    <line x1="0" y1="-10" x2="0" y2="-60" stroke="#f093fb" stroke-width="3"/>
    <circle cx="0" cy="-10" r="4" fill="#f5576c"/>
    <!-- Joint -->
    <circle cx="0" cy="-60" r="4" fill="#f5576c"/>
    <!-- Forearm -->
    <line x1="0" y1="-60" x2="50" y2="-80" stroke="#f093fb" stroke-width="3"/>
    <circle cx="50" cy="-80" r="4" fill="#f5576c"/>
    <!-- Gripper -->
    <line x1="50" y1="-80" x2="65" y2="-95" stroke="#f093fb" stroke-width="2"/>
    <line x1="50" y1="-80" x2="65" y2="-65" stroke="#f093fb" stroke-width="2"/>
  </g>
  <!-- Circuit traces -->
  <g opacity="0.12" stroke="#f5576c" stroke-width="1.5" fill="none">
    <path d="M30,160 L80,160 L80,140 L130,140"/>
    <path d="M50,120 L100,120 L100,100 L150,100"/>
    <path d="M40,200 L90,200 L90,220 L140,220"/>
    <path d="M200,50 L250,50 L250,70 L300,70 L300,50 L350,50"/>
  </g>
  <!-- Nodes -->
  <g opacity="0.15" fill="#f5576c">
    <circle cx="130" cy="140" r="3"/><circle cx="150" cy="100" r="3"/>
    <circle cx="140" cy="220" r="3"/><circle cx="350" cy="50" r="3"/>
  </g>
  <!-- Floating tech dots -->
  <g opacity="0.08" fill="#f093fb">
    <circle cx="80" cy="40" r="1.5"/><circle cx="280" cy="30" r="2"/>
    <circle cx="320" cy="230" r="1.5"/><circle cx="70" cy="250" r="2"/>
  </g>
</svg>