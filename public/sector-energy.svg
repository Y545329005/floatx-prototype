<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="50%" style="stop-color:#0D2137"/>
      <stop offset="100%" style="stop-color:#1A4A5E"/>
    </linearGradient>
    <linearGradient id="glow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="neon"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#glow)"/>
  <!-- Sun -->
  <circle cx="480" cy="60" r="45" fill="url(#sun)"/>
  <circle cx="480" cy="60" r="20" fill="rgba(255,215,0,0.15)"/>
  <!-- Sun rays -->
  <g opacity="0.08" stroke="#FFD700" stroke-width="1">
    <line x1="480" y1="5" x2="480" y2="-10"/><line x1="480" y1="115" x2="480" y2="130"/>
    <line x1="425" y1="60" x2="410" y2="60"/><line x1="535" y1="60" x2="550" y2="60"/>
    <line x1="441" y1="21" x2="430" y2="10"/><line x1="519" y1="99" x2="530" y2="110"/>
    <line x1="519" y1="21" x2="530" y2="10"/><line x1="441" y1="99" x2="430" y2="110"/>
  </g>
  <!-- Solar panel -->
  <g transform="translate(60,140)" opacity="0.18">
    <rect x="0" y="0" width="50" height="30" rx="2" fill="none" stroke="#4facfe" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="50" y2="10" stroke="#4facfe" stroke-width="0.8"/>
    <line x1="0" y1="20" x2="50" y2="20" stroke="#4facfe" stroke-width="0.8"/>
    <line x1="25" y1="0" x2="25" y2="30" stroke="#4facfe" stroke-width="0.8"/>
  </g>
  <g transform="translate(120,120)" opacity="0.18">
    <rect x="0" y="0" width="50" height="30" rx="2" fill="none" stroke="#4facfe" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="50" y2="10" stroke="#4facfe" stroke-width="0.8"/>
    <line x1="0" y1="20" x2="50" y2="20" stroke="#4facfe" stroke-width="0.8"/>
    <line x1="25" y1="0" x2="25" y2="30" stroke="#4facfe" stroke-width="0.8"/>
  </g>
  <!-- Wind turbine -->
  <g transform="translate(300,180)" opacity="0.2">
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#4facfe" stroke-width="2.5"/>
    <circle cx="0" cy="-70" r="3" fill="#4facfe"/>
    <line x1="0" y1="-70" x2="25" y2="-95" stroke="#4facfe" stroke-width="1.8"/>
    <line x1="0" y1="-70" x2="-20" y2="-90" stroke="#4facfe" stroke-width="1.8"/>
    <line x1="0" y1="-70" x2="5" y2="-95" stroke="#4facfe" stroke-width="1.8"/>
  </g>
  <!-- Energy waves -->
  <g opacity="0.06" fill="none" stroke="#00f2fe" stroke-width="1">
    <path d="M30,230 Q80,210 130,230 Q180,250 230,230 Q280,210 330,230 Q380,250 430,230 Q480,210 530,230 Q580,250 600,235"/>
    <path d="M30,245 Q80,225 130,245 Q180,265 230,245 Q280,225 330,245 Q380,265 430,245 Q480,225 530,245 Q580,265 600,250"/>
  </g>
  <!-- Floating particles -->
  <g opacity="0.06" fill="#00f2fe">
    <circle cx="50" cy="40" r="1.5"/><circle cx="200" cy="30" r="1"/>
    <circle cx="380" cy="260" r="1.5"/><circle cx="150" cy="270" r="1"/>
  </g>
</svg>