<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0C29"/>
      <stop offset="50%" style="stop-color:#302B63"/>
      <stop offset="100%" style="stop-color:#24243E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D2FF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3A7BD5;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#glow)"/>
  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="50" x2="600" y2="50"/><line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/><line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/><line x1="350" y1="0" x2="350" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/><line x1="450" y1="0" x2="450" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/><line x1="550" y1="0" x2="550" y2="300"/>
  </g>
  <!-- Quantum circuit lines -->
  <g opacity="0.15" stroke="#00D2FF" stroke-width="1.5" fill="none">
    <path d="M50,90 L100,90 L100,70 L150,70 L150,90 L200,90"/>
    <path d="M80,130 L130,130 L130,150 L180,150 L180,130 L230,130"/>
    <path d="M120,170 L170,170 L170,190 L220,190 L220,170 L270,170"/>
  </g>
  <!-- Qubit circles -->
  <g opacity="0.2" fill="none" stroke="#00D2FF" stroke-width="1">
    <circle cx="50" cy="90" r="4"/><circle cx="100" cy="90" r="4"/>
    <circle cx="150" cy="70" r="4"/><circle cx="200" cy="90" r="4"/>
    <circle cx="80" cy="130" r="4"/><circle cx="180" cy="150" r="4"/>
    <circle cx="120" cy="170" r="4"/><circle cx="270" cy="170" r="4"/>
  </g>
  <!-- Central atom/orbit graphic -->
  <g transform="translate(420,140)">
    <ellipse cx="0" cy="0" rx="70" ry="25" fill="none" stroke="rgba(0,210,255,0.2)" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="70" ry="25" fill="none" stroke="rgba(0,210,255,0.15)" stroke-width="1" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="70" ry="25" fill="none" stroke="rgba(0,210,255,0.15)" stroke-width="1" transform="rotate(-60)"/>
    <circle cx="0" cy="0" r="8" fill="rgba(0,210,255,0.4)"/>
    <circle cx="0" cy="0" r="3" fill="#00D2FF"/>
    <!-- Electrons -->
    <circle cx="70" cy="0" r="3" fill="#00D2FF" filter="url(#neon)"/>
    <circle cx="-35" cy="-60" r="3" fill="#00D2FF" filter="url(#neon)"/>
    <circle cx="-35" cy="60" r="3" fill="#00D2FF" filter="url(#neon)"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="560" cy="250" r="2" fill="rgba(0,210,255,0.3)"/>
  <circle cx="575" cy="230" r="1.5" fill="rgba(0,210,255,0.2)"/>
  <circle cx="20" cy="30" r="1.5" fill="rgba(0,210,255,0.2)"/>
</svg>