<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <radialGradient id="bg" cx="58%" cy="44%" r="80%">
      <stop offset="0%" stop-color="#18233d"/><stop offset="45%" stop-color="#101a30"/><stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a87c" stop-opacity=".42"/><stop offset="100%" stop-color="#c9a87c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#c9a87c" fill-opacity=".2"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="40" cy="650" r="430" fill="none" stroke="#c9a87c" stroke-opacity=".1"/>
  <rect x="150" y="130" width="182" height="118" fill="url(#dots)"/>
  <!-- ledger chain -->
  <g fill="none" stroke="#c9a87c" stroke-opacity=".5" stroke-width="1.3" stroke-linejoin="round">
    <rect x="430" y="470" width="44" height="44" rx="9"/>
    <rect x="496" y="470" width="44" height="44" rx="9" stroke-opacity=".36"/>
    <rect x="562" y="470" width="44" height="44" rx="9" stroke-opacity=".24"/>
    <line x1="474" y1="492" x2="496" y2="492" stroke-opacity=".5"/>
    <line x1="540" y1="492" x2="562" y2="492" stroke-opacity=".3"/>
  </g>
  <!-- node constellation -->
  <g stroke="#c9a87c" stroke-opacity=".3" stroke-width="1" fill="none">
    <line x1="700" y1="300" x2="820" y2="220"/><line x1="700" y1="300" x2="860" y2="360"/>
    <line x1="820" y1="220" x2="950" y2="280"/><line x1="860" y1="360" x2="950" y2="280"/>
    <line x1="860" y1="360" x2="920" y2="460"/><line x1="700" y1="300" x2="640" y2="392"/>
    <line x1="640" y1="392" x2="860" y2="360"/>
  </g>
  <circle cx="820" cy="220" r="6" fill="#c9a87c"/>
  <circle cx="700" cy="300" r="9" fill="url(#glow)"/><circle cx="700" cy="300" r="5" fill="#c9a87c"/>
  <circle cx="860" cy="360" r="5" fill="#c9a87c" fill-opacity=".8"/>
  <circle cx="950" cy="280" r="4.5" fill="#c9a87c" fill-opacity=".65"/>
  <circle cx="920" cy="460" r="4" fill="#c9a87c" fill-opacity=".5"/>
  <circle cx="640" cy="392" r="4" fill="#c9a87c" fill-opacity=".5"/>
  <line x1="640" y1="392" x2="562" y2="470" stroke="#c9a87c" stroke-opacity=".24" stroke-width="1"/>
  <circle cx="1030" cy="170" r="3" fill="#c9a87c" fill-opacity=".4"/>
</svg>
