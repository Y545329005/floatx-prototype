<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <radialGradient id="bg" cx="40%" cy="52%" r="82%">
      <stop offset="0%" stop-color="#18233d"/><stop offset="45%" stop-color="#101a30"/><stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a87c" stop-opacity=".45"/><stop offset="100%" stop-color="#c9a87c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#c9a87c" fill-opacity=".2"/>
    </pattern>
    <linearGradient id="ray" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c9a87c" stop-opacity=".9"/><stop offset="100%" stop-color="#c9a87c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="380" fill="none" stroke="#c9a87c" stroke-opacity=".1"/>
  <rect x="820" y="440" width="182" height="118" fill="url(#dots)"/>
  <!-- stacked cells -->
  <g fill="none" stroke-linejoin="round">
    <rect x="290" y="430" width="330" height="58" rx="10" stroke="#c9a87c" stroke-opacity=".6" stroke-width="1.4"/>
    <rect x="306" y="356" width="298" height="58" rx="10" stroke="#c9a87c" stroke-opacity=".42" stroke-width="1.3"/>
    <rect x="322" y="282" width="266" height="58" rx="10" stroke="#c9a87c" stroke-opacity=".28" stroke-width="1.2"/>
  </g>
  <!-- energy rays -->
  <g stroke="url(#ray)" stroke-width="1.6" stroke-linecap="round">
    <line x1="380" y1="278" x2="380" y2="150"/>
    <line x1="455" y1="278" x2="455" y2="118"/>
    <line x1="530" y1="278" x2="530" y2="162"/>
  </g>
  <circle cx="455" cy="104" r="26" fill="url(#glow)"/>
  <circle cx="455" cy="104" r="5" fill="#c9a87c"/>
  <g stroke="#c9a87c" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round">
    <line x1="676" y1="459" x2="700" y2="459"/><line x1="688" y1="447" x2="688" y2="471"/>
  </g>
  <circle cx="960" cy="180" r="3.5" fill="#c9a87c" fill-opacity=".45"/>
  <circle cx="180" cy="200" r="3" fill="#c9a87c" fill-opacity=".4"/>
</svg>
