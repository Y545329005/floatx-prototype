<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="80%">
      <stop offset="0%" stop-color="#18233d"/><stop offset="45%" stop-color="#101a30"/><stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a87c" stop-opacity=".35"/><stop offset="100%" stop-color="#c9a87c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#c9a87c" fill-opacity=".2"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a87c" stop-opacity="0"/><stop offset="50%" stop-color="#c9a87c" stop-opacity=".9"/><stop offset="100%" stop-color="#c9a87c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1150" cy="640" r="420" fill="none" stroke="#c9a87c" stroke-opacity=".1"/>
  <rect x="880" y="150" width="182" height="118" fill="url(#dots)"/>
  <!-- imaging cross-section -->
  <circle cx="560" cy="330" r="118" fill="url(#glow)"/>
  <circle cx="560" cy="330" r="118" fill="none" stroke="#c9a87c" stroke-opacity=".4" stroke-width="1.3"/>
  <circle cx="560" cy="330" r="76" fill="none" stroke="#c9a87c" stroke-opacity=".24" stroke-dasharray="3 8"/>
  <g fill="#c9a87c">
    <circle cx="560" cy="330" r="4.5"/>
    <circle cx="606" cy="292" r="3.5" fill-opacity=".7"/><circle cx="512" cy="368" r="3.5" fill-opacity=".6"/>
    <circle cx="586" cy="382" r="3" fill-opacity=".5"/><circle cx="528" cy="290" r="3" fill-opacity=".5"/>
  </g>
  <!-- scan line -->
  <line x1="380" y1="330" x2="740" y2="330" stroke="url(#scan)" stroke-width="1.6"/>
  <!-- focus brackets -->
  <g fill="none" stroke="#c9a87c" stroke-opacity=".65" stroke-width="1.5" stroke-linecap="round">
    <path d="M414 268v-28h28"/><path d="M678 240h28v28"/>
    <path d="M706 392v28h-28"/><path d="M442 420h-28v-28"/>
  </g>
  <!-- clinical mark -->
  <g stroke="#c9a87c" stroke-opacity=".5" stroke-width="1.3" stroke-linecap="round">
    <line x1="906" y1="470" x2="938" y2="470"/><line x1="922" y1="454" x2="922" y2="486"/>
  </g>
  <circle cx="200" cy="520" r="3" fill="#c9a87c" fill-opacity=".4"/>
  <circle cx="1020" cy="240" r="3.5" fill="#c9a87c" fill-opacity=".45"/>
</svg>
