<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23005EB8'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white'%3E%E5%AF%8C%3C/text%3E%3C/svg%3E" />
    <title>财富平台</title>
    <script>
      // 主题预置（FOUC 防闪）：React mount 前设好 data-theme，避免首帧渲染旧皮肤再跳变。
      // 合法值：''（经典/legacy，默认）| 'hkbtc'（HKBTC 2.0 kit 皮肤）
      try {
        var t = localStorage.getItem('zhifu-theme');
        if (t === 'hkbtc') document.documentElement.dataset.theme = 'hkbtc';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
